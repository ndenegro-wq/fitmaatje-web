<style>
:root{

  --amber:#F9A825; --red:#C62828; --bg:#F4F7F2; --card:#fff; --text:#1c1c1c; --muted:#5f6660; --line:#dfe6dc;
}
@media (prefers-color-scheme: dark){

    --green:#66BB6A; --green-dark:#A5D6A7; --green-light:#1f3322; --leaf:#AED581;
    --bg:#101410; --card:#1a201a; --text:#ecefea; --muted:#a3aba0; --line:#2b352b;
  }
}
:root[data-theme="dark"]{
  --green:#66BB6A; --green-dark:#A5D6A7; --green-light:#1f3322; --leaf:#AED581;
  --bg:#101410; --card:#1a201a; --text:#ecefea; --muted:#a3aba0; --line:#2b352b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--green-dark);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;font-weight:700;font-size:18px}

main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}

h1{font-size:22px;margin:0 0 12px} h2{font-size:17px;margin:0 0 8px}

.muted{color:var(--muted);font-size:14px}

textarea,input,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.tag{font-size:12px;border-radius:6px;padding:2px 6px;background:var(--green-light);color:var(--green-dark)}

.bubble{max-width:85%;padding:10px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff}

.vid{display:block;width:100%;text-align:left;margin-top:6px;border:1.5px solid var(--green);border-radius:10px;background:transparent;color:var(--green-dark);padding:8px 10px;font:inherit;font-size:14px}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--green-light);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:6px}

.datebar{display:flex;align-items:center;margin-bottom:8px}

.install{background:#FFF8E1;color:#5d4600;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}

<body>
<header>FitMaatje</header>
<main id="main"></main>
<nav id="nav"></nav>
<input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="gal" accept="image/*" class="hidden">

<script>
"use strict";
// ======================================================= storage (IndexedDB, fallback memory)
const DB = (() => {
  let dbp = null, mem = {};
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("fitmaatje", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    async get(k, d) {
      const db = await open();
      if (!db) return k in mem ? mem[k] : d;
      return new Promise((res) => {
        try {
          const q = db.transaction("kv").objectStore("kv").get(k);
          q.onsuccess = () => res(q.result === undefined ? d : q.result);
          q.onerror = () => res(d);
        } catch (e) { res(d); }
      });
    },
    async set(k, v) {
      mem[k] = v;
      const db = await open();
      if (!db) return;
      return new Promise((res) => {
        try {
          const t = db.transaction("kv", "readwrite");
          t.objectStore("kv").put(v, k);
          t.oncomplete = res; t.onerror = res;
        } catch (e) { res(); }
      });
    },
  };
})();

// ======================================================= state
const DEF = {
  name: "", apiKey: "", model: "claude-sonnet-5-5", kcal: 1500, protein: 110,
  moments: "07:30,10:00,12:30,15:30,18:00,20:30",
  protocol: "Gezond en duurzaam afvallen, gevarieerd eten, voldoende eiwit en groente.",
  prefs: "", heightCm: "", startWeight: "", goalWeight: "", startDate: "", healthNotes: "",
};
let S = { ...DEF }, entries = [], plans = {}, chat = [];
let activeCoach = "ayse", helpChoice = "", copyStatus = "";
let tab = "today", viewDate = todayStr(), planDate = null;
let planBusy = null, planErr = null;

function todayStr(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(ds, n) { const d = new Date(ds + "T12:00:00"); d.setDate(d.getDate() + n); return todayStr(d); }
function hm(d = new Date()) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function toMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function moments() {
  return S.moments.split(/[,; ]+/).map((t) => t.trim()).filter((t) => /^\d{1,2}:\d{2}$/.test(t))
    .map((t) => t.padStart(5, "0")).sort();
}
function momentAt(t = hm()) {
  let best = null, diff = 1e9;
  moments().forEach((m, i) => { const d = Math.abs(toMin(m) - toMin(t)); if (d <= 60 && d < diff) { best = i + 1; diff = d; } });
  return best;
}
function dayEntries(ds) { return entries.filter((e) => e.date === ds); }
function sum(ds) {
  const l = dayEntries(ds);
  const s = { kcal: 0, protein: 0, sportMin: 0, sportKcal: 0, moments: new Set() };
  l.forEach((e) => {
    (e.foods || []).forEach((f) => { s.kcal += f.kcal || 0; s.protein += f.protein || 0; });
    (e.exercises || []).forEach((x) => { s.sportMin += x.minutes || 0; s.sportKcal += x.kcal || 0; });
    if ((e.foods || []).length && e.moment) s.moments.add(e.moment);
  });
  return s;
}
function lastWeight() { for (let i = entries.length - 1; i >= 0; i--) if (entries[i].weight) return entries[i]; return null; }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (ds) => new Date(ds + "T12:00:00").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });

async function save() {
  await DB.set("settings", S); await DB.set("entries", entries); await DB.set("plans", plans); await DB.set("chat", chat.slice(-60));
}

// ======================================================= Claude API (streaming, retries)
let lastStop = "";
async function callOnce(system, messages, maxTokens) {
  if (!S.apiKey) throw new Error("Nog geen API-sleutel ingesteld. Ga naar Instellingen.");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": S.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: S.model || DEF.model, max_tokens: maxTokens, system, messages, stream: true }),
  });
  if (!r.ok) {
    let msg = await r.text();
    try { msg = JSON.parse(msg).error.message; } catch (e) {}
    const err = new Error(`Coach niet bereikbaar (${r.status}): ${String(msg).slice(0, 300)}`);
    err.fatal = true; throw err;
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", out = ""; lastStop = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      let o; try { o = JSON.parse(line.slice(5)); } catch (e) { continue; }
      if (o.type === "content_block_delta" && o.delta && o.delta.type === "text_delta") out += o.delta.text;
      else if (o.type === "message_delta" && o.delta && o.delta.stop_reason) lastStop = o.delta.stop_reason;
      else if (o.type === "error") { const e = new Error("Coach-fout: " + (o.error && o.error.message)); e.fatal = true; throw e; }
    }
  }
  return out.trim();
}
async function callClaude(system, messages, maxTokens = 1500) {
  let last;
  for (let a = 0; a < 3; a++) {
    try { return await callOnce(system, messages, maxTokens); }
    catch (e) { if (e.fatal) throw e; last = e; await new Promise((r) => setTimeout(r, 1500 * (a + 1))); }
  }
  throw new Error("Geen verbinding met de coach (" + (last && last.message) + "). Houd de app open en probeer opnieuw.");
}
async function callJson(system, user, maxTokens, imgB64) {
  let raw = "";
  for (let a = 0; a < 2; a++) {
    const extra = a ? "\n\nBELANGRIJK: antwoord direct en uitsluitend met het JSON-object, beginnend met { en eindigend met }." : "";
    const content = imgB64
      ? [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: imgB64 } }, { type: "text", text: user + extra }]
      : user + extra;
    raw = await callClaude(system, [{ role: "user", content }], a ? maxTokens * 2 : maxTokens);
    const s = raw.indexOf("{"), e = raw.lastIndexOf("}");
    if (s >= 0 && e > s) { try { return JSON.parse(raw.slice(s, e + 1)); } catch (x) {} }
  }
  throw new Error("Coach gaf geen bruikbaar antwoord (" + (lastStop === "max_tokens" ? "te lang" : raw ? raw.slice(0, 100) : "leeg") + "). Probeer opnieuw.");
}

function coachSystem() {
  return `Je bent FitMaatje, de persoonlijke voedings- en sportcoach van ${S.name || "de gebruiker"}. Je spreekt Nederlands: direct, warm, kort en concreet.
Plan en afspraken: ${S.protocol}
Profiel (alleen wat gebruiker invulde): lengte ${S.heightCm || "onbekend"} cm; startgewicht ${S.startWeight || "onbekend"} kg; gewenst einddoel ${S.goalWeight || "onbekend"} kg; startdatum ${S.startDate || "onbekend"}.
Gezondheid en aandachtspunten: ${S.healthNotes || "nog niet ingevuld"}.
Werk met haalbare tussendoelen, zonder beloofde einddatum. Verzin geen voortgang. Bij zoete trek: vraag naar tijd, hoeveelheid, honger, gewoonte of stress. Geen schuldgevoel, totaalverbod of compensatie door vasten/sport. Vraag naar actuele beperkingen voordat je oefeningen geeft. Bij pijn op de borst, ernstige benauwdheid of flauwvallen adviseer spoedzorg.
De coachnamen zijn AI-rollen van dezelfde dienst, geen geregistreerde zorgverleners. Dagdoelen zijn door de gebruiker ingestelde waarden; controleer passendheid en adviseer geen strenger doel zonder intake.
Dagdoel: ${S.kcal} kcal en circa ${S.protein} g eiwit. Eetmomenten: ${moments().map((m, i) => `${i + 1}=${m}`).join(", ")}.
Voorkeuren / niet eten: ${S.prefs || "geen opgegeven"}.
Je bent een coach, geen arts: bij klachten, zwangerschap, duizeligheid of pijn verwijs je naar huisarts of diëtist. Moedig nooit extreem weinig eten of overtraining aan.`;
}
function contextText(days = 2) {
  const now = new Date();
  let s = `Nu: ${now.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" })} ${hm(now)}\n`;
  const p = plans[todayStr()];
  if (p) s += `Eetschema vandaag (${p.theme}): ${p.meals.map((m) => `${m.moment}=${m.title} ${mealKcal(m)} kcal`).join("; ")}\n`;
  const w = lastWeight(); if (w) s += `Laatste gewicht: ${w.weight} kg op ${w.date}\n`;
  for (let k = days - 1; k >= 0; k--) {
    const ds = addDays(todayStr(), -k), l = dayEntries(ds); if (!l.length) continue;
    const t = sum(ds);
    s += `\n${k ? ds : "VANDAAG"}: ${t.kcal} kcal, ${t.protein} g eiwit, sport ${t.sportMin} min, momenten ${[...t.moments].sort().join(",")}\n`;
    if (k <= 1) l.forEach((e) => {
      s += `  ${e.time} ` + (e.foods || []).map((f) => `${f.name} ${f.amount} (${f.kcal} kcal)`).join("; ")
        + ((e.exercises || []).length ? " sport: " + e.exercises.map((x) => `${x.name} ${x.detail} ${x.minutes} min`).join("; ") : "")
        + (e.weight ? ` gewicht ${e.weight} kg` : "") + "\n";
    });
  }
  return s;
}

async function processLog(text, photo) {
  const now = new Date(), fallback = momentAt(hm(now));
  const base = { id: Date.now(), ts: Date.now(), date: todayStr(now), time: hm(now), text, photo: photo ? photo.thumb : null };
  if (!S.apiKey) return { ...base, moment: fallback, foods: [], exercises: [], weight: null, reply: "Opgeslagen. Stel je API-sleutel in bij Instellingen om calorieën te berekenen." };
  const photoNote = photo ? `Er is een FOTO van het eten bijgevoegd. Herken alle onderdelen en schat de portiegroottes (gebruik bord, bestek, verpakking of hand als referentie). Combineer met de tekst als die er is (tekst gaat voor bij twijfel). Zet in reply kort dat het een schatting op basis van de foto is.` : "";
  const user = `${contextText(2)}

Ingesproken tekst van ${S.name || "de gebruiker"}:
«${text || "(geen tekst, alleen foto)"}»
${photoNote}

Zet dit om naar precies één JSON-object (geen tekst eromheen) met deze velden:
{"foods":[{"name":"","amount":"","kcal":0,"protein_g":0}],"exercises":[{"name":"","detail":"","minutes":0,"kcal":0}],"weight_kg":null,"moment":null,"reply":""}
Regels:
- foods: alles wat gegeten wordt/werd. Realistische kcal en eiwit voor Nederlandse porties (NEVO). amount = hoeveelheid zoals genoemd of geschat.
- exercises: sport/oefeningen; detail bijv. "3x12" of "5 km"; schat minuten en kcal.
- weight_kg alleen als gewicht genoemd wordt.
- moment: nummer eetmoment (1-${moments().length}) op basis van tijd en tekst; null als buiten schema of geen eten.
- reply: max 3 korte zinnen: wat je noteerde, wat er vandaag nog over is (kcal/eiwit), één concrete tip. Eerlijk maar vriendelijk als iets buiten schema valt.`;
  let o;
  try { o = await callJson(coachSystem(), user, 4000, photo ? photo.b64 : null); }
  catch (e) { return { ...base, moment: fallback, foods: [], exercises: [], weight: null, reply: "Opgeslagen, maar berekenen lukte niet: " + e.message }; }
  const foods = (o.foods || []).map((f) => ({ name: f.name || "", amount: f.amount || "", kcal: Math.round(+f.kcal || 0), protein: Math.round(+f.protein_g || +f.protein || 0) }));
  const exercises = (o.exercises || []).map((x) => ({ name: x.name || "", detail: x.detail || "", minutes: Math.round(+x.minutes || 0), kcal: Math.round(+x.kcal || 0) }));
  let moment = o.moment == null ? (foods.length ? fallback : null) : +o.moment;
  if (!(moment >= 1 && moment <= moments().length)) moment = foods.length ? fallback : null;
  const weight = o.weight_kg && +o.weight_kg > 0 ? +o.weight_kg : null;
  return { ...base, moment, foods, exercises, weight, reply: o.reply || "" };
}

// ======================================================= meal plans
const mealKcal = (m) => (m.foods || []).reduce((a, f) => a + (f.kcal || 0), 0);
const mealProt = (m) => (m.foods || []).reduce((a, f) => a + (f.protein || 0), 0);
function openMoments(ds) {
  const all = moments().map((t, i) => [i + 1, t]);
  if (ds !== todayStr()) return all;
  const now = toMin(hm()) - 20, eaten = sum(ds).moments;
  return all.filter(([n, t]) => toMin(t) > now && !eaten.has(n));
}
function defaultPlanDate() { return openMoments(todayStr()).length ? todayStr() : addDays(todayStr(), 1); }
function normMeal(m, fb) {
  return { moment: +m.moment || fb, time: m.time || "", title: m.title || "", note: m.note || "",
    foods: (m.foods || []).map((f) => ({ name: f.name || "", amount: f.amount || "", kcal: Math.round(+f.kcal || 0), protein: Math.round(+f.protein_g || +f.protein || 0) })) };
}
function planRules(open, kcal, prot) {
  return `Eisen:
- Plan precies deze eetmomenten (nummer=tijd): ${open.map(([n, t]) => `${n}=${t}`).join(", ")}.
- Samen ${kcal} kcal (marge ±40) en minimaal ${prot} g eiwit. Grotere maaltijden op hoofdmomenten, kleine tussendoortjes.
- Volg het plan: ${S.protocol}
- Wissel de eiwitbron af t.o.v. de afgelopen dagen (kip, vis, ei, kwark/skyr, mager vlees, peulvruchten/tofu).
- Gewone, betaalbare supermarktproducten (Nederland of Spanje). Simpele bereiding, max 15 min doordeweeks.
- Concrete hoeveelheden (gram/stuks/el), kcal en eiwit realistisch volgens NEVO.
- Voorkeuren / niet eten: ${S.prefs || "geen opgegeven"}`;
}
async function generatePlan(ds, wish) {
  const open = openMoments(ds);
  if (!open.length) throw new Error("De eetmomenten van vandaag zijn voorbij. Kies ▶ voor morgen.");
  const partial = open.length < moments().length;
  const eaten = ds === todayStr() ? sum(ds) : { kcal: 0, protein: 0 };
  const kcal = Math.max(200, S.kcal - eaten.kcal), prot = Math.max(15, S.protein - eaten.protein);
  const recent = [1, 2, 3, 4].map((k) => plans[addDays(ds, -k)]).filter(Boolean)
    .map((p) => `${p.date}: ${p.theme} (${p.meals.map((m) => m.title).join(", ")})`).join("; ") || "geen";
  const user = `Maak een eetschema voor ${S.name || "de gebruiker"} voor ${fmtDate(ds)} (${ds}). Het is nu ${todayStr()} ${hm()}.

${planRules(open, kcal, prot)}
Recente schema's (niet herhalen): ${recent}
${wish ? "Extra wens: " + wish : ""}

Antwoord met alleen één JSON-object:
{"theme":"korte naam eiwitfocus","tip":"1 korte praktische tip","meals":[{"moment":${open[0][0]},"time":"${open[0][1]}","title":"","foods":[{"name":"","amount":"","kcal":0,"protein_g":0}],"note":"max 1 zin bereiding"}]}`;
  const o = await callJson("Je bent een Nederlandse voedingscoach die nauwkeurige, haalbare dagmenu's maakt. Antwoord compact.", user, 6000);
  let meals = (o.meals || []).map((m, i) => normMeal(m, i + 1));
  const f = meals.filter((m) => open.some(([n]) => n === m.moment)); if (f.length) meals = f;

  meals.sort((a, b) => a.moment - b.moment);
  plans[ds] = { date: ds, theme: o.theme || "", tip: o.tip || "", meals };
  Object.keys(plans).forEach((k) => { if (k < addDays(todayStr(), -30)) delete plans[k]; });
  await save();
}

${wish ? "Wens: " + wish : ""}

function splitVideos(t) {

  let m; while ((m = re.exec(t))) {

    if (!vids.some((v) => v.name.toLowerCase() === name.toLowerCase())) vids.push({ name, q });

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false, recTarget = null;
function startDictation(targetId, btn) {
  if (!SR) { alert("Inspreken via de app werkt niet in deze browser. Tik in het tekstvak en gebruik de 🎤 van je toetsenbord."); return; }
  stopDictation();
  recTarget = targetId; recActive = true;
  rec = new SR(); rec.lang = "nl-NL"; rec.continuous = true; rec.interimResults = true;
  const el = document.getElementById(targetId); const base = el.value ? el.value + " " : "";
  let finalText = "";
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript + " ";
      else interim += ev.results[i][0].transcript;
    }
    const t = document.getElementById(recTarget); if (t) t.value = (base + finalText + interim).trimStart();
  };
  rec.onend = () => { if (recActive) { try { rec.start(); } catch (e) { stopDictation(); } } };
  rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { stopDictation(); alert("Geef de microfoon toestemming (Instellingen › Safari › Microfoon) of gebruik de 🎤 van je toetsenbord."); } };
  try { rec.start(); } catch (e) {}
  markMic();
}
function stopDictation() { recActive = false; if (rec) { try { rec.stop(); } catch (e) {} } rec = null; markMic(); }
function markMic() {
  document.querySelectorAll("[data-mic]").forEach((b) => {
    const on = recActive && b.dataset.mic === recTarget;
    b.classList.toggle("on", on); b.textContent = on ? "■" : "🎤";
  });
}
async function readPhoto(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const draw = (max, q) => {
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q);
  };
  const full = draw(1280, 0.82), thumb = draw(560, 0.7);
  URL.revokeObjectURL(url);
  return { b64: full.split(",")[1], thumb };
}

  <div class="chips">${Object.entries(HELP).map(([id,h])=>`<button onclick="chooseHelp('${id}')" aria-pressed="${helpChoice===id}">${esc(h.label)}</button>`).join("")}</div>
  ${help ? `<div role="status" style="margin-top:12px">${esc(help.text)}</div><button class="btn" style="margin-top:12px" onclick="helpToCoach()" ${chatBusy ? "disabled" : ""}>Bespreek dit met Emma</button><div class="muted small" style="margin-top:6px">Deze eerste stap werkt ook zonder verbinding.</div>` : ""}
  <div class="chips"><button onclick="startCheck('morning')">☀️ Ochtendcheck</button><button onclick="startCheck('evening')">🌙 Avondcheck</button></div></div>`;
}
function chooseHelp(id) { helpChoice = HELP[id] ? id : ""; render(); }
function selectCoach(id) { if (chatBusy) return; activeCoach = COACHES.some(c=>c.id===id) ? id : "ayse"; go("coach"); }
function teamCard() {
  return `<div class="card"><h2>Kies je coach</h2><div class="chips">${COACHES.map(c=>`<button onclick="selectCoach('${c.id}')" aria-pressed="${activeCoach===c.id}" ${chatBusy ? "disabled" : ""}><b>${esc(c.name)}</b><br>${esc(c.role)}${activeCoach===c.id ? " · gekozen" : ""}</button>`).join("")}</div><div class="muted small" style="margin-top:10px">Eén gedeeld gesprek, ieder met een eigen aandachtspunt.</div></div>`;
}
function draftCoach(id, text) {
  if (chatBusy) return;
  activeCoach = id; go("coach");
  const q = document.getElementById("q"); q.value = text; q.focus();
  q.scrollIntoView({block:"center",behavior:"smooth"});
}
function helpToCoach() { const h = HELP[helpChoice]; if(h) draftCoach("emma", h.question); }
function startCheck(kind) {
  draftCoach("ayse", kind === "morning" ? "Ochtendcheck: help me met mijn eetplan en haalbare acties vandaag. Vraag naar mijn slaap, energie en dagplanning." : "Avondcheck: vraag naar wat ik gegeten heb, beweging, energie en zoete trek. Help me één verbetering voor morgen te kiezen.");
}
function progressCard() {
  const w=lastWeight(), current=w ? Number(w.weight) : Number(S.startWeight), start=Number(S.startWeight), goal=Number(S.goalWeight);
  const valid=start>0 && goal>0 && current>0 && start>goal;
  const pct=valid ? Math.max(0,Math.min(100,(start-current)/(start-goal)*100)) : 0;
  return `<div class="card"><h2>Mijn voortgang</h2><div>${current>0 ? `${current} kg${w ? " · laatst gelogd" : " · startgewicht"}` : "Log je gewicht om je voortgang te volgen."}${goal>0 ? ` · gewenst einddoel ${goal} kg` : ""}</div>
  ${valid ? `<div class="bar" role="progressbar" aria-label="Voortgang naar gewenst einddoel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div style="width:${pct}%"></div></div>` : ""}
  <div class="muted small">Bekijk de trend over meerdere weken. Een losse meting is geen oordeel.</div><div class="chips"><button onclick="draftCoach('noor','Bespreek mijn voortgang op basis van mijn gelogde gegevens. Benoem wat nog ontbreekt.')">Vraag Noor</button><button onclick="go('settings')">Mijn profiel</button></div>
  <button class="btn out" style="margin-top:12px" onclick="copyOverview()">Overzicht kopiëren voor ChatGPT</button><div role="status" class="muted small" style="margin-top:8px">${esc(copyStatus)}</div>
  <textarea id="shareOverview" class="hidden" readonly aria-label="Overzicht om handmatig te kopiëren"></textarea>
  <div class="muted small" style="margin-top:6px">Plak dit zelf in je gesprek met Ayse. Je API-sleutel wordt niet meegenomen.</div></div>`;
}
function overviewText() {
  return `FitMaatje-overzicht voor mijn dieetbegeleiding\nNaam: ${S.name || "niet ingevuld"}\nLengte: ${S.heightCm || "niet ingevuld"} cm\nStartgewicht: ${S.startWeight || "niet ingevuld"} kg\nGewenst einddoel: ${S.goalWeight || "niet ingevuld"} kg\nStartdatum: ${S.startDate || "niet ingevuld"}\nVoorkeuren: ${S.prefs || "niet ingevuld"}\nAandachtspunten: ${S.healthNotes || "niet ingevuld"}\n\n${contextText(7)}\nBegeleid me met één haalbare volgende stap. De gelogde calorieën zijn schattingen; ontbrekende logs betekenen niet dat ik niets gegeten heb.`;
}
async function copyOverview() {
  const text=overviewText();
  try { await navigator.clipboard.writeText(text); copyStatus="Gekopieerd. Plak het in je ChatGPT-gesprek met Ayse."; render(); }
  catch(e) { copyStatus="Kopiëren lukt hier niet automatisch. Selecteer en kopieer de tekst hieronder."; render(); const el=document.getElementById("shareOverview"); el.classList.remove("hidden"); el.value=text; el.focus(); el.select(); }
}

function viewCoach() {
  let h = `<h1>Mijn coachteam</h1>${supportCard()}${teamCard()}${progressCard()}<div class="row"><h2 class="grow">Gesprek met ${esc((COACHES.find(c=>c.id===activeCoach)||COACHES[0]).name)}</h2><button class="link" onclick="if(confirm('Gesprek wissen?')){chat=[];save();render()}">Wissen</button></div>`;
  if (!chat.length) h += `<div class="muted">Vraag wat je wilt. Bijvoorbeeld:</div><div class="chips">${[
    "Wat kan ik vanavond nog eten met wat ik over heb?", "Geef me een training van 20 minuten thuis met voorbeelden.", "Hoe ging mijn week?",
  ].map((s) => `<button onclick="document.getElementById('q').value=this.textContent">${esc(s)}</button>`).join("")}</div><br>`;
  h += `<div class="card muted small">De coaches zijn AI-rollen via je ingestelde Claude-verbinding. Ze delen dit dagboek en gesprek. De check-ins in ChatGPT verschijnen hier niet automatisch.</div><div class="chat">${chat.map((m) => {
    if (m.me) return `<div class="bubble me">${esc(m.t)}</div>`;
    const [body, vids] = splitVideos(m.t);
    return `<div class="bubble">${m.coach ? `<b>${esc(m.coach)}</b><br>` : ""}${esc(body)}${vids.length ? `<div class="muted small" style="margin-top:8px">Bekijk hoe het moet:</div>` +
      vids.map((v) => `<a class="vid" style="text-decoration:none" href="${ytUrl(v.q)}" target="_blank" rel="noopener">▶ ${esc(v.name)}</a>`).join("") : ""}</div>`;
  }).join("")}${chatBusy ? `<div class="muted"><span class="spinner"></span>Coach denkt na…</div>` : ""}</div>
  <div class="composer">${SR ? `<button class="round" data-mic="q" onclick="recActive&&recTarget==='q'?stopDictation():startDictation('q')">🎤</button>` : ""}
  <textarea id="q" placeholder="Typ of spreek je vraag"></textarea>
  <button class="round" style="background:var(--green);color:#fff" onclick="sendQ()" ${chatBusy ? "disabled" : ""}>➤</button></div>`;
  return h;
}
function sendQ() { const q = document.getElementById("q").value.trim(); if (!q || chatBusy) return; stopDictation(); ask(q); }

function viewSettings() {
  const f = (id, label, val, type = "text", extra = "") => `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}>`;
  return `<h1>Instellingen</h1>
  <div class="card"><h2>Over jou</h2>
    ${f("s_name", "Naam", S.name)}
    ${f("s_height", "Lengte (cm)", S.heightCm, "number", 'min="100" max="250" step="0.1"')}
    <div class="row"><div class="grow">${f("s_startweight", "Startgewicht (kg)", S.startWeight, "number", 'min="30" max="400" step="0.1"')}</div><div class="grow">${f("s_goalweight", "Gewenst einddoel (kg)", S.goalWeight, "number", 'min="30" max="400" step="0.1"')}</div></div>
    ${f("s_startdate", "Startdatum", S.startDate, "date")}
    <label for="s_health">Gezondheid, medicatie en aandachtspunten (bijv. zoete trek)</label><textarea id="s_health">${esc(S.healthNotes)}</textarea>
    <div class="row"><div class="grow">${f("s_kcal", "kcal per dag", S.kcal, "number", 'inputmode="numeric"')}</div><div class="grow">${f("s_prot", "eiwit (g)", S.protein, "number", 'inputmode="numeric"')}</div></div>
    ${f("s_mom", "Eetmomenten (bijv. 07:30,10:00,12:30,15:30,18:00,20:30)", S.moments)}
    <label for="s_proto">Plan / afspraken met coach of diëtist</label><textarea id="s_proto">${esc(S.protocol)}</textarea>
    <label for="s_prefs">Wat ik lekker vind / niet eet / allergieën</label><textarea id="s_prefs" style="min-height:80px">${esc(S.prefs)}</textarea>
  </div>
  <div class="card"><h2>Coach (Claude)</h2>
    ${f("s_key", "Anthropic API-sleutel (sk-ant-…)", S.apiKey, "password", 'autocomplete="off" autocapitalize="off" spellcheck="false"')}
    <div class="muted small" style="margin-top:6px">Je sleutel blijft alleen op deze telefoon en gaat rechtstreeks naar Anthropic.</div>
    ${f("s_model", "Model", S.model, "text", 'autocapitalize="off" spellcheck="false"')}
  </div>
  <button class="btn" onclick="saveSettings()">Opslaan</button>
  <div id="saved" class="muted" style="margin-top:8px"></div>
  <div class="card" style="margin-top:16px"><h2>Gegevens</h2><div class="muted small">Je dagboek en instellingen worden lokaal in deze browser bewaard. Wis je browsergegevens, dan kunnen ze verloren gaan. Voor AI-advies worden relevante gegevens naar Anthropic gestuurd. Maak regelmatig een back-up.</div><br>
  <button class="btn out" onclick="exportData()">Back-up downloaden</button></div>`;
}
async function saveSettings() {
  const v = (id) => document.getElementById(id).value;
  const height = Number(v("s_height")), start = Number(v("s_startweight")), goal = Number(v("s_goalweight"));
  if ((v("s_height") && (height < 100 || height > 250)) || (v("s_startweight") && (start < 30 || start > 400)) || (v("s_goalweight") && (goal < 30 || goal > 400))) {
    document.getElementById("saved").textContent = "Controleer je lengte en gewichten."; return;
  }
  S.heightCm = v("s_height"); S.startWeight = v("s_startweight"); S.goalWeight = v("s_goalweight"); S.startDate = v("s_startdate"); S.healthNotes = v("s_health").trim();
  S.name = v("s_name").trim(); S.kcal = parseInt(v("s_kcal")) || DEF.kcal; S.protein = parseInt(v("s_prot")) || DEF.protein;
  S.moments = v("s_mom").trim() || DEF.moments; S.protocol = v("s_proto").trim() || DEF.protocol; S.prefs = v("s_prefs").trim();
  S.apiKey = v("s_key").trim(); S.model = v("s_model").trim() || DEF.model;
  await save(); document.getElementById("saved").textContent = "Opgeslagen ✓";
}
function exportData() {
  const blob = new Blob([JSON.stringify({ settings: { ...S, apiKey: "" }, entries, plans, chat }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fitmaatje-backup-" + todayStr() + ".json"; a.click();
}

function render() {
  // keep typed text when re-rendering
  const lt = document.getElementById("logText"); if (lt) window._logDraft = lt.value;
  const w = document.getElementById("wish"); if (w) window._wish = w.value;
  const q = document.getElementById("q"), qv = q ? q.value : null;
  renderNav();
  const m = document.getElementById("main");
  m.innerHTML = tab === "today" ? viewToday() : tab === "plan" ? viewPlan() : tab === "log" ? viewLog() : tab === "coach" ? viewCoach() : viewSettings();
  const q2 = document.getElementById("q"); if (q2 && qv) q2.value = qv;
  markMic();
}

(async () => {
  S = { ...DEF, ...(await DB.get("settings", {})) };
  entries = await DB.get("entries", []); plans = await DB.get("plans", {}); chat = await DB.get("chat", []);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // Het coachteam en directe hulp zijn ook zonder API-sleutel bereikbaar.
  render();
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (viewDate > todayStr()) viewDate = todayStr(); render(); } });
</script>
</body>
</html>
